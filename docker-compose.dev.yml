x-api-environment: &api-environment
  PORT: "4000"
  MIGRATE_ON_START: "true"
  DATABASE_POOL_SIZE: "10"
  SECRET_KEY_BASE: dev-secret-key-base-that-is-long-enough-for-wisp-0123456789
  CORS_ALLOWED_ORIGINS: "*"
  APP_NAME: Starter App
  EMAIL_BACKEND: smtp
  EMAIL_HOST: mailpit
  EMAIL_PORT: "1025"
  EMAIL_USE_TLS: "false"
  EMAIL_HOST_USER: app
  EMAIL_HOST_PASSWORD: mailpit-accepts-any-password
  EMAIL_FROM: Starter App <no-reply@example.com>

services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: app
    ports:
      - "${POSTGRES_PORT:-54329}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d app"]
      interval: 2s
      timeout: 3s
      retries: 30

  mailpit:
    image: axllent/mailpit:latest
    environment:
      MP_SMTP_AUTH_ACCEPT_ANY: "true"
      MP_SMTP_AUTH_ALLOW_INSECURE: "true"
      MP_MAX_MESSAGES: "5000"
    ports:
      - "${MAILPIT_UI_PORT:-8025}:8025"
      - "${MAILPIT_SMTP_PORT:-1025}:1025"

  api:
    build: .
    restart: unless-stopped
    cpus: 1.0
    mem_limit: 1g
    memswap_limit: 1g
    depends_on:
      postgres:
        condition: service_healthy
      mailpit:
        condition: service_started
    environment:
      <<: *api-environment
      DATABASE_URL: postgres://postgres:postgres@postgres:5432/app
    ports:
      - "${API_PORT:-4000}:4000"

  api-load:
    profiles: ["loadtest"]
    build: .
    restart: unless-stopped
    cpus: 1.0
    mem_limit: 1g
    memswap_limit: 1g
    depends_on:
      postgres:
        condition: service_healthy
      mailpit:
        condition: service_started
    environment:
      <<: *api-environment
      DATABASE_URL: postgres://postgres:postgres@postgres:5432/app_load
    ports:
      - "${API_LOAD_PORT:-4001}:4000"

  k6:
    profiles: ["loadtest"]
    image: grafana/k6:latest
    volumes:
      - ./scripts/load:/scripts
    environment:
      API_BASE_URL: http://api-load:4000/api/v1
      K6_WEB_DASHBOARD: "true"
      K6_WEB_DASHBOARD_HOST: 0.0.0.0
      K6_WEB_DASHBOARD_PERIOD: 5s
    ports:
      - "${K6_DASHBOARD_PORT:-5665}:5665"
